name: grpc-service
description: "gRPC microservice with Clean Architecture"
version: "1.0.0"

vars:
  - name: service_name
    type: string
    required: true
    prompt: "Service name?"
    validate:
      pattern: "^[a-z][a-z0-9-]*$"
      message: "Lowercase letters, numbers, and hyphens only"

  - name: module_path
    type: string
    required: true
    prompt: "Go module path?"
    default: "github.com/muhmunt/{{.service_name}}"

  - name: database
    type: select
    prompt: "Database?"
    options:
      - label: "PostgreSQL"
        value: postgres
      - label: "MySQL"
        value: mysql
      - label: "MongoDB"
        value: mongodb
      - label: "None"
        value: none
    default: none

  - name: architecture
    type: select
    prompt: "Architecture?"
    options:
      - label: "Clean Architecture"
        value: clean
      - label: "Hexagonal"
        value: hexagonal
      - label: "Standard (flat internal/)"
        value: standard
    default: clean

  - name: go_version
    type: string
    prompt: "Go version?"
    default: "1.22"

  - name: include_docker
    type: bool
    prompt: "Include Docker files?"
    default: true

  - name: include_ci
    type: bool
    prompt: "Include GitHub Actions CI?"
    default: true

files:
  - src: presets/grpc/files/cmd/main.go.tmpl
    dst: "cmd/{{.service_name}}/main.go"

  - src: shared/go.mod.tmpl
    dst: "go.mod"

  - src: presets/grpc/files/proto/service.proto.tmpl
    dst: "proto/{{.service_name}}/v1/service.proto"

  - src: presets/grpc/files/internal/handler/grpc_handler.go.tmpl
    dst: "internal/handler/grpc_handler.go"

  - src: presets/grpc/files/internal/usecase/usecase.go.tmpl
    dst: "internal/usecase/usecase.go"
    condition: '{{ne .architecture "standard"}}'

  - src: presets/grpc/files/internal/repository/repository.go.tmpl
    dst: "internal/repository/repository.go"
    condition: '{{and (ne .architecture "standard") (ne .database "none")}}'

  - src: presets/grpc/files/config/config.yaml.tmpl
    dst: "config/config.yaml"

  - src: shared/Dockerfile.tmpl
    dst: "Dockerfile"
    condition: "{{.include_docker}}"

  - src: shared/docker-compose.yml.tmpl
    dst: "docker-compose.yml"
    condition: "{{.include_docker}}"

  - src: shared/.github/workflows/ci.yml.tmpl
    dst: ".github/workflows/ci.yml"
    condition: "{{.include_ci}}"

  - src: presets/grpc/files/buf.gen.yaml.tmpl
    dst: "buf.gen.yaml"

  - src: presets/grpc/files/buf.yaml.tmpl
    dst: "buf.yaml"

  - src: shared/Makefile.tmpl
    dst: "Makefile"

dependencies:
  - pkg: "google.golang.org/grpc v1.64.0"
  - pkg: "google.golang.org/protobuf v1.34.2"
  - pkg: "github.com/lib/pq v1.10.9"
    condition: '{{eq .database "postgres"}}'
  - pkg: "github.com/go-sql-driver/mysql v1.8.1"
    condition: '{{eq .database "mysql"}}'
  - pkg: "go.mongodb.org/mongo-driver v1.16.0"
    condition: '{{eq .database "mongodb"}}'
  - pkg: "go.uber.org/zap"
  - pkg: "github.com/spf13/viper"

hooks:
  pre: []
  post:
    - cmd: "go mod tidy"
